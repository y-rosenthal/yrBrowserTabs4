project:
  type: book
  output-dir: _book

book:
  title: "TabMaster AI — Documentation"
  author: "YR"
  reader-mode: true
  chapters:
    - index.qmd
    - README.md
    - part: "Specifications"
      chapters:
        - docs/spec-conventions.qmd
        # Add new spec files here, newest first:
        - docs/SPEC-4.2.0-v002-Tour_responsiveness_guide_numbering_domain_sort_and_Escape_key.qmd
        - docs/SPEC-4.2.0-v001-Preview_panel_redesign_domain_browsing_move_undo_and_selection_memory.qmd
        - docs/SPEC-4.1.1-v001-Stable_row_order_when_closing_tabs.qmd
        - docs/SPEC-4.1.0-v001-Gemini_model_update_tour_preview_pills_search_scope_always_maximized.qmd
        - docs/SPEC-4.0.5-v001-Full_code_review_findings_and_fixes.qmd
        - docs/SPEC-4.0.4-v002-Card_view_context_menus_sort_and_click_nav.qmd
        - docs/SPEC-4.0.4-v001-Card_view_numeric_sort_rename_and_click_nav.qmd
        - docs/SPEC-4.0.2-v003-Flicker_onboarding_and_stability_fixes.qmd
        - docs/SPEC-4.0.2-v002-Window_names_preview_and_layout_fixes.qmd
        - docs/SPEC-4.0.2-v001-Sequential_default_window_names.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    include-after-body: sidebar-resize.html
    grid:
      sidebar-width: 340px
    toc: true
    number-sections: false
